name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,report]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy src/swarm_core
      - name: Test
        run: pytest --cov=swarm_core --cov-report=xml --cov-fail-under=0
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        continue-on-error: true
        with:
          files: coverage.xml
          fail_ci_if_error: false

  smoke:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,report]"
      - name: Smoke S1 (only if cli exists)
        run: |
          if [ -f src/swarm_core/cli.py ]; then
            mkdir -p results/smoke
            swarm-sim run --scenario S1 --seed 0 --profile clean --time-limit 90 --output results/smoke
            swarm-sim report --run-dir results/smoke --output report.html
            echo "Smoke OK"
          else
            echo "NÃO EXECUTADO: src/swarm_core/cli.py ainda não existe (Lote 5)"
          fi
      - name: Upload report
        if: hashFiles('report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: report.html

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Tier B images (only if compose exists)
        run: |
          if [ -f docker/docker-compose.yml ]; then
            docker compose -f docker/docker-compose.yml build --pull
          else
            echo "NÃO EXECUTADO: docker/docker-compose.yml ainda não existe (Lote 9)"
          fi
